name: Tests

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CLOUDNOW_DISABLE_LIVE_SERVICES: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      TZ: UTC
    steps:
      - uses: actions/checkout@v7

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Run tvOS test plan
        run: Scripts/test.sh

      - name: Report failing tests
        if: failure()
        run: python3 Scripts/report-test-failures.py

      - name: Print relay latency benchmark
        if: always()
        run: |
          r=$(ls -td TestArtifacts/**/*.xcresult TestArtifacts/*.xcresult 2>/dev/null | head -1)
          if [ -n "$r" ]; then
            xcrun xcresulttool get log --path "$r" --type console 2>/dev/null | grep -o "RELAY_LOOPBACK_LATENCY.*" | head -3 | while IFS= read -r line; do echo "::notice::$line"; done || true
          fi

      - name: Upload compact coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloudnow-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestArtifacts/**/Coverage/targets.*
            TestArtifacts/**/Coverage/required-sources.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failed test result
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cloudnow-xcresult-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestArtifacts/**/*.xcresult
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
